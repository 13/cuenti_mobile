name: Build & Release APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  # Pinned so a Flutter stable release cannot break the build with no
  # change on our side. Bump deliberately.
  FLUTTER_VERSION: '3.47.2'

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib test integration_test tool

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      # The lcov file used to be uploaded and never looked at. A floor set
      # below the current number does not block today's work but does catch
      # a feature landing with no tests behind it.
      - name: Check coverage
        run: dart run tool/check_coverage.dart 70

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

  build:
    name: Build Release APK
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Without this the build silently falls back to the debug key, which
      # ships with every Android SDK -- anything signed with it can be
      # replaced in place by anyone. A release must never go out that way,
      # so a missing secret fails the job instead.
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set."
            echo "::error::Refusing to build a release with the debug key."
            echo "::error::See docs/release-signing.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          BUILD_DATE=$(date +'%Y-%m-%d')
          BUILD_TIME=$(date +'%H:%M:%S')
          flutter build apk --release --dart-define=BUILD_DATE=$BUILD_DATE --dart-define=BUILD_TIME=$BUILD_TIME

      # Flutter's Gradle plugin fixes the names under flutter-apk/ as
      # app-*.apk, so the app's own name is applied here rather than fought
      # for in build.gradle.kts. The app- copies are kept alongside: every
      # release up to v2.2.0 shipped those names, and the installed clients
      # out there look for them by name -- dropping them would leave those
      # users unable to update to anything, ever.
      - name: Name the APKs for the app
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-release.apk app-*-release.apk; do
            [ -e "$f" ] || continue
            cp "$f" "cuenti-${f#app-}"
          done
          ls -1 *.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuenti-release-apk
          path: |
            build/app/outputs/flutter-apk/cuenti-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Build split APKs
        run: |
          BUILD_DATE=$(date +'%Y-%m-%d')
          BUILD_TIME=$(date +'%H:%M:%S')
          flutter build apk --split-per-abi --dart-define=BUILD_DATE=$BUILD_DATE --dart-define=BUILD_TIME=$BUILD_TIME

      # Proves the shipped APK carries the release certificate. A build that
      # quietly fell back to the debug key would pass every other check.
      - name: Verify the APKs are not debug-signed
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          for apk in build/app/outputs/flutter-apk/app-*.apk; do
            echo "== $apk"
            if "$APKSIGNER" verify --print-certs "$apk" \
                 | grep -qi "CN=Android Debug"; then
              echo "::error::$apk is signed with the Android debug key."
              exit 1
            fi
          done

      - name: Name the split APKs for the app
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            [ -e "$f" ] || continue
            cp "$f" "cuenti-${f#app-}"
          done
          ls -1 *.apk

      - name: Upload split APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cuenti-split-apks
          path: |
            build/app/outputs/flutter-apk/cuenti-*-release.apk
            build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Only for docs/release-notes-next.md below; the APKs come from the
      # build job's artifacts, not from a rebuild.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: cuenti-release-apk
          path: artifacts/

      - name: Download split APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: cuenti-split-apks
          path: artifacts/split/

      # docs/release-notes-next.md, when present, is prepended to the
      # generated notes. The in-app updater shows this same body, so it is
      # the only place a user can be told something the commit list cannot
      # say -- that this particular version needs a reinstall, say.
      - name: Read release preamble
        id: preamble
        run: |
          if [ -f docs/release-notes-next.md ]; then
            {
              echo 'body<<PREAMBLE_EOF'
              cat docs/release-notes-next.md
              echo
              echo 'PREAMBLE_EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'body=' >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.preamble.outputs.body }}
          generate_release_notes: true
          files: |
            artifacts/cuenti-release.apk
            artifacts/split/cuenti-*-release.apk
            artifacts/app-release.apk
            artifacts/split/app-*-release.apk
