name: Build & Release APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  # Pinned so a Flutter stable release cannot break the build with no
  # change on our side. Bump deliberately.
  FLUTTER_VERSION: '3.47.2'

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

  build:
    name: Build Release APK
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          BUILD_DATE=$(date +'%Y-%m-%d')
          BUILD_TIME=$(date +'%H:%M:%S')
          flutter build apk --release --dart-define=BUILD_DATE=$BUILD_DATE --dart-define=BUILD_TIME=$BUILD_TIME

      # Flutter's Gradle plugin fixes the names under flutter-apk/ as
      # app-*.apk, so the app's own name is applied here rather than fought
      # for in build.gradle.kts. The app- copies are kept alongside: every
      # release up to v2.2.0 shipped those names, and the installed clients
      # out there look for them by name -- dropping them would leave those
      # users unable to update to anything, ever.
      - name: Name the APKs for the app
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-release.apk app-*-release.apk; do
            [ -e "$f" ] || continue
            cp "$f" "cuenti-${f#app-}"
          done
          ls -1 *.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuenti-release-apk
          path: |
            build/app/outputs/flutter-apk/cuenti-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Build split APKs
        run: |
          BUILD_DATE=$(date +'%Y-%m-%d')
          BUILD_TIME=$(date +'%H:%M:%S')
          flutter build apk --split-per-abi --dart-define=BUILD_DATE=$BUILD_DATE --dart-define=BUILD_TIME=$BUILD_TIME

      - name: Name the split APKs for the app
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            [ -e "$f" ] || continue
            cp "$f" "cuenti-${f#app-}"
          done
          ls -1 *.apk

      - name: Upload split APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cuenti-split-apks
          path: |
            build/app/outputs/flutter-apk/cuenti-*-release.apk
            build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: cuenti-release-apk
          path: artifacts/

      - name: Download split APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: cuenti-split-apks
          path: artifacts/split/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/cuenti-release.apk
            artifacts/split/cuenti-*-release.apk
            artifacts/app-release.apk
            artifacts/split/app-*-release.apk
