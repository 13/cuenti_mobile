name: Build & Release APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Pinned so a Flutter stable release cannot break the build with no
  # change on our side. Bump deliberately.
  FLUTTER_VERSION: '3.47.2'

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install dependencies
        run: flutter pub get

      # Generated sources are committed, and nothing else here re-runs the
      # generators, so a .g.dart or app_localizations_*.dart left stale by a
      # change to its input passes every other check. That is not
      # hypothetical: abb834a carried an auth_controller.g.dart whose hash
      # did not match its own source, through format, analyze, 853 tests and
      # the coverage floor, without a murmur.
      - name: Verify generated code is current
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          if ! git diff --quiet; then
            echo "::error::Generated files are out of date. Run:"
            echo "::error::  flutter gen-l10n"
            echo "::error::  dart run build_runner build --delete-conflicting-outputs"
            echo "::error::and commit the result. Changed:"
            git diff --name-only | sed 's/^/  /'
            exit 1
          fi
          echo "generated files match their sources"

      - name: Verify formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib test integration_test tool

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      # The lcov file used to be uploaded and never looked at. A floor set
      # below the current number does not block today's work but does catch
      # a feature landing with no tests behind it.
      #
      # The floor only means anything now that check_coverage counts files
      # lcov never mentions. It used to score whole untested screens as
      # absent rather than as zero, so adding one moved the number not at
      # all -- the router's redirect, the scheduled screen and the audit
      # screen all sat outside it.
      - name: Check coverage
        run: dart run tool/check_coverage.dart 80

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

  build:
    name: Build Release APK
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history and tags: the release-note check below compares this
          # tag against the previous one, which a shallow clone cannot see.
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Only for tags, which are the only builds that publish. A push to
      # main or a pull request produces artifacts nobody installs, so
      # requiring the release key there just breaks ordinary CI -- which is
      # exactly what it did.
      #
      # For a tag the key is mandatory: without it the build falls back to
      # the debug key, which ships with every Android SDK, and anything
      # signed with that can be replaced in place by anyone.
      - name: Restore release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set."
            echo "::error::Refusing to build a release with the debug key."
            echo "::error::See docs/release-signing.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Gradle only discovers a wrong alias five minutes into assembleRelease,
      # and reports it as a KeytoolException among a wall of build output.
      # This answers the same question in a second, and lists what the
      # keystore actually holds so the fix is obvious.
      - name: Verify the keystore holds the configured alias
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if ! keytool -list -keystore android/app/release.jks \
               -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEY_ALIAS is not an alias in the keystore."
            echo "The keystore contains:"
            keytool -list -keystore android/app/release.jks \
              -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
              | grep -i 'Alias name:' || echo "  (could not read: is ANDROID_KEYSTORE_PASSWORD right?)"
            exit 1
          fi
          echo "alias found in keystore"

      # The APK reports the version from pubspec.yaml, while the release the
      # in-app updater compares against is this tag. Let them disagree and
      # every user is told an update is available, installs it, still reports
      # the old version, and is told again -- a nag that only "skip" silences.
      - name: Verify pubspec version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PUBSPEC=$(grep '^version:' pubspec.yaml | sed 's/^version: *//' | cut -d+ -f1)
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PUBSPEC" != "$TAG" ]; then
            echo "::error::pubspec.yaml is $PUBSPEC but the tag is $TAG."
            echo "::error::Bump pubspec.yaml and re-tag, or the update"
            echo "::error::checker will offer this release forever."
            exit 1
          fi
          echo "pubspec $PUBSPEC matches tag $TAG"

      # docs/release-notes-next.md is prepended to the release body and shown
      # verbatim by the in-app updater, so a copy left over from the previous
      # release actively misinforms -- 2.3.0's "this update needs a reinstall"
      # nearly went out with 2.3.1, telling everyone to uninstall for nothing.
      - name: Verify the release note was written for this release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -z "$PREVIOUS" ]; then
            echo "no previous tag; nothing to compare against"
            exit 0
          fi
          if [ ! -f docs/release-notes-next.md ]; then
            echo "no release note for this release, which is allowed"
            exit 0
          fi
          if git diff --quiet "$PREVIOUS" "${GITHUB_REF_NAME}" -- docs/release-notes-next.md; then
            echo "::error::docs/release-notes-next.md is unchanged since $PREVIOUS."
            echo "::error::It is shown to users verbatim, so it would repeat"
            echo "::error::the previous release's notes. Rewrite it or delete it."
            exit 1
          fi
          echo "release note was updated since $PREVIOUS"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          BUILD_DATE=$(date +'%Y-%m-%d')
          BUILD_TIME=$(date +'%H:%M:%S')
          flutter build apk --release --dart-define=BUILD_DATE=$BUILD_DATE --dart-define=BUILD_TIME=$BUILD_TIME

      # Flutter's Gradle plugin fixes the names under flutter-apk/ as
      # app-*.apk, so the app's own name is applied here rather than fought
      # for in build.gradle.kts. The app- copies are kept alongside: every
      # release up to v2.2.0 shipped those names, and the installed clients
      # out there look for them by name -- dropping them would leave those
      # users unable to update to anything, ever.
      - name: Name the APKs for the app
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-release.apk app-*-release.apk; do
            [ -e "$f" ] || continue
            cp "$f" "cuenti-${f#app-}"
          done
          ls -1 *.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuenti-release-apk
          path: |
            build/app/outputs/flutter-apk/cuenti-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Build split APKs
        run: |
          BUILD_DATE=$(date +'%Y-%m-%d')
          BUILD_TIME=$(date +'%H:%M:%S')
          flutter build apk --split-per-abi --dart-define=BUILD_DATE=$BUILD_DATE --dart-define=BUILD_TIME=$BUILD_TIME

      # Proves the shipped APK carries the release certificate. A build that
      # quietly fell back to the debug key would pass every other check.
      # Tags only, for the same reason: everything else is debug-signed on
      # purpose.
      - name: Verify the APKs are not debug-signed
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          for apk in build/app/outputs/flutter-apk/app-*.apk; do
            echo "== $apk"
            if "$APKSIGNER" verify --print-certs "$apk" \
                 | grep -qi "CN=Android Debug"; then
              echo "::error::$apk is signed with the Android debug key."
              exit 1
            fi
          done

      - name: Name the split APKs for the app
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            [ -e "$f" ] || continue
            cp "$f" "cuenti-${f#app-}"
          done
          ls -1 *.apk

      - name: Upload split APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cuenti-split-apks
          path: |
            build/app/outputs/flutter-apk/cuenti-*-release.apk
            build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Only for docs/release-notes-next.md below; the APKs come from the
      # build job's artifacts, not from a rebuild.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: cuenti-release-apk
          path: artifacts/

      - name: Download split APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: cuenti-split-apks
          path: artifacts/split/

      # docs/release-notes-next.md, when present, is prepended to the
      # generated notes. The in-app updater shows this same body, so it is
      # the only place a user can be told something the commit list cannot
      # say -- that this particular version needs a reinstall, say.
      - name: Read release preamble
        id: preamble
        run: |
          if [ -f docs/release-notes-next.md ]; then
            {
              echo 'body<<PREAMBLE_EOF'
              cat docs/release-notes-next.md
              echo
              echo 'PREAMBLE_EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'body=' >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          # Node's global fetch (undici) does not honor NODE_EXTRA_CA_CERTS
          # for TLS verification (confirmed locally), so the self-hosted
          # Gitea instance's CA can't be trusted that way; disable cert
          # verification only when not running on github.com, where the
          # real API's cert is always publicly trusted.
          NODE_TLS_REJECT_UNAUTHORIZED: ${{ github.server_url != 'https://github.com' && '0' || '1' }}
        with:
          body: ${{ steps.preamble.outputs.body }}
          generate_release_notes: ${{ github.server_url == 'https://github.com' }}
          files: |
            artifacts/cuenti-release.apk
            artifacts/split/cuenti-*-release.apk
            artifacts/app-release.apk
            artifacts/split/app-*-release.apk
