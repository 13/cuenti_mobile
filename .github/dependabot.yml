# The app ships signed APKs straight to users, so an unattended CVE in a
# transitive dependency is the realistic supply-chain risk here -- there is
# no store review or server-side patch between a bad dependency and an
# install. Weekly, grouped, so it is a handful of PRs to review rather than
# thirty.
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps land together: individually they are noise,
      # and CI (analyze, 500+ tests, a coverage floor) is what actually
      # decides whether they are safe.
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      production-minor:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    # Majors come one at a time: riverpod, go_router and dio have all had
    # migrations that needed reading, and analysis_options.yaml already
    # documents one dependency knot that took untangling.
    ignore: []

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
